<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil da profissional - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="perfil">
    <!-- Tudo vem do banco (perfil.html?id=3): iniciarPerfil, em app.js. -->
    <main class="wrap grid2">
        <div class="card">
            <div style="display:flex;gap:16px;align-items:center">
                <div id="avDiarista"></div>
                <div>
                    <h2 style="margin:0" id="nomeDiarista">Carregando...</h2>
                    <span id="notaDiarista"></span>
                </div>
                <!-- Abre (ou reaproveita) a conversa com esta diarista: configurarBotaoMensagem, em app.js -->
                <button type="button" id="enviarMensagem" class="btn out" style="margin-left:auto">Enviar mensagem</button>
            </div>

            <h3 style="margin-top:20px">Sobre</h3>
            <p id="sobreDiarista"></p>

            <h3 style="margin-top:16px">Zonas onde atende</h3>
            <div class="chips" id="zonasDiarista"></div>

            <h3 style="margin-top:16px">Serviços oferecidos</h3>
            <div class="chips" id="servicosDiarista"></div>

            <h3 id="av-perfil" style="margin-top:16px">Avaliações</h3>
            <div id="avaliacoesDiarista"></div>
        </div>

        <!-- Data, horário e valor são escolhidos na tela Solicitar Serviço. -->
        <div class="card" style="align-self:start">
            <button type="button" id="agendar" class="btn full"
                style="padding:20px;font-size:20px">Agendar diária</button>
            <p style="text-align:center;margin-top:10px"><small>Na próxima tela você escolhe o serviço, a data e o horário.</small></p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
