<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensagens - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="mensagens">
<main class="wrap">
    <div class="card chat">
        <!-- Preenchido pelo app.js com as conversas do usuário logado -->
        <aside id="contatos"></aside>

        <section>
            <!-- Preenchido pelo app.js com o histórico da conversa aberta -->
            <div class="msgs" id="msgs"></div>
            <div class="send">
                <input id="txt" placeholder="Escreva uma mensagem" aria-label="Mensagem" autocomplete="off">
                <button type="button" id="enviar" class="btn">Enviar</button>
            </div>
        </section>
    </div>
</main>

<script src="js/app.js"></script>
</body>

</html>
