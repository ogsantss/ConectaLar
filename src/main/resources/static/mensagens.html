<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensagens - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="mensagens">
    <main class="wrap">
        <div class="card chat">
            <aside id="contatos">
                <div class="on"><span class="av">MA</span>Maria Aparecida</div>
                <div><span class="av">LR</span>Luana Ribeiro</div>
                <div><span class="av">FL</span>Fernanda Lima</div>
            </aside>

            <section>
                <div class="msgs" id="msgs">
                    <div class="m">Bom dia! Vi seu pedido de limpeza para sábado.</div>
                    <div class="m me">Pode chegar às 8h?</div>
                    <div class="m">Posso sim! Confirmo o agendamento.</div>
                </div>
                <div class="send">
                    <input id="txt" placeholder="Escreva uma mensagem" aria-label="Mensagem" autocomplete="off">
                    <button type="button" id="enviar" class="btn">Enviar</button>
                </div>
            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
