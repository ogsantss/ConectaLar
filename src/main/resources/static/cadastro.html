<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cadastro">
<main class="card auth">
    <div class="tabs">
        <button>ENTRAR</button>
        <button class="on">CADASTRAR</button>
    </div>
    <h2 style="text-align:center">Criar sua conta conectaLar</h2>
    <form><label>Nome completo</label><input  id="nome" placeholder="Nome completo" required><label>E-mail</label><input
            type="email" id="email" placeholder="E-mail"><label >Senha</label>
        <div class="pw"><input type="password" id="senha" placeholder="Senha"><span>👁</span></div>
        <label
                style="font-weight:400"><input type="checkbox" style="width:auto" required> Aceito os termos de
            uso</label>
        <div class="err"></div>
        <input type="button" id="cadastrar" class="btn full">CRIAR CONTA</input>
    </form>
</main>
<script src="js/app.js"></script>
<script src="cadastro.js"></script>

</body>

</html>
