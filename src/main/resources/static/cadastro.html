<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="cadastro">
<main class="card auth">
    <div class="tabs">
        <button type="button">ENTRAR</button>
        <button type="button" class="on">CADASTRAR</button>
    </div>

    <h2 style="text-align:center">Criar sua conta conectaLar</h2>

    <form>
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" placeholder="Nome completo" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required>
        <label for="celular">Telefone</label>
        <input type="number" id="celular" name="celular" placeholder="1199999999" required min="10" max="10">

        <label for="senha">Senha</label>
        <div class="pw">
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="new-password" required>
            <span role="button" tabindex="0" aria-label="Mostrar senha">👁</span>
        </div>

        <fieldset class="role">
            <legend>Eu sou</legend>
            <label class="role-opt">
                <input type="radio" name="tipo" value="CLIENT" required>
                <span>🏠 Cliente</span>
            </label>
            <label class="role-opt">
                <input type="radio" name="tipo" value="DIARIST">
                <span>🧹 Diarista</span>
            </label>
        </fieldset>

        <label for="termos" style="font-weight:400">
            <input type="checkbox" id="termos" style="width:auto" required> Aceito os termos de uso
        </label>

        <div class="err" role="alert" aria-live="polite"></div>

        <button type="button" id="cadastrar" class="btn full">CRIAR CONTA</button>
    </form>
</main>

<script src="js/app.js"></script>
<script src="cadastro.js"></script>
</body>

</html>
