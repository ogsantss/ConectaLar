<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avaliar serviço - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="avaliar">
<main class="wrap" style="max-width:640px">
    <!-- Preenchido por iniciarAvaliar, em app.js, com a solicitação de avaliar.html?solicitacao=ID -->
    <form id="formAvaliar" class="card" novalidate>
        <h2 style="text-align:center">Avaliar serviço</h2>
        <p style="text-align:center">Como foi com <b id="nomeAvaliado">...</b>?<br>
            <small id="resumoServico">Carregando...</small></p>

        <fieldset class="role" style="grid-template-columns:repeat(5,1fr)">
            <legend>Nota</legend>
            <label class="role-opt"><input type="radio" name="nota" value="1"><span>1 ★</span></label>
            <label class="role-opt"><input type="radio" name="nota" value="2"><span>2 ★</span></label>
            <label class="role-opt"><input type="radio" name="nota" value="3"><span>3 ★</span></label>
            <label class="role-opt"><input type="radio" name="nota" value="4"><span>4 ★</span></label>
            <label class="role-opt"><input type="radio" name="nota" value="5"><span>5 ★</span></label>
        </fieldset>

        <label for="comentario">Comentário (opcional)</label>
        <textarea id="comentario" name="comentario" rows="4" maxlength="500"
                  placeholder="Conte como foi o serviço"></textarea>

        <p class="err" id="erroAvaliar" role="alert"></p>

        <button type="submit" id="enviarAvaliacao" class="btn full">Enviar avaliação</button>
        <p style="text-align:center;margin-top:12px"><a id="voltar" href="index.html">Voltar</a></p>
    </form>
</main>

<script src="js/app.js"></script>
</body>

</html>
