<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar profissionais - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="busca">
    <main class="wrap">
        <!-- A zona é escolhida clicando no próprio mapa (abaixo). Aqui fica só o tipo de serviço. -->
        <div class="card" style="display:flex;gap:10px;margin-bottom:16px">
            <!-- Opções carregadas de GET /solicitacoes/tipos (iniciarBusca). -->
            <select id="filtroServico" aria-label="Tipo de serviço"></select>
        </div>

        <div class="grid2" style="grid-template-columns:1fr 1.6fr">
            <div>
                <h2><span id="n">0</span> profissionais perto de você</h2>
                <div id="lista"></div>
            </div>
            <!-- Mapa do estado de SP: o interior aparece bloqueado (em breve) e só as 4 zonas da capital
                 são clicáveis. Clicar numa zona filtra a lista; clicar de novo volta para todas. -->
            <div class="map">
                <svg class="mapa-zonas" viewBox="0 0 600 700" role="group"
                     aria-label="Mapa do estado de São Paulo: por enquanto só as zonas da capital estão disponíveis">
                    <defs>
                        <!-- Listras do interior "bloqueado" -->
                        <pattern id="bloqueado" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                            <rect width="10" height="10" fill="#eef2f4"/>
                            <line x1="0" y1="0" x2="0" y2="10" stroke="#dde5e9" stroke-width="4"/>
                        </pattern>
                        <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b6f8a" flood-opacity=".15"/>
                        </filter>
                    </defs>

                    <!-- Interior do estado: só desenho, não é clicável -->
                    <g class="estado" aria-hidden="true">
                        <title>Em breve: por enquanto atendemos só a capital</title>
                        <path d="M24.6,202.7 C25.1,199.3 34.8,191.2 40.5,184.9 C46.2,178.6 52.7,172.8 58.7,165.1 C64.8,157.4 70.9,147.5 77,138.7 C83.1,129.9 89.7,120 95.3,112.3 C100.9,104.6 104.4,100.2 110.5,92.5 C116.6,84.8 125.3,74.9 131.9,66.1 C138.5,57.3 142.5,46 150.1,39.7 C157.8,33.4 168.4,31 177.6,28.5 C186.7,26 195.8,23.2 205,24.5 C214.1,25.8 223.3,33.9 232.4,36.4 C241.5,38.9 251.2,41 259.8,39.7 C268.5,38.4 275.6,29.6 284.2,28.5 C292.8,27.4 301.5,31.8 311.6,33.1 C321.8,34.4 334,36.7 345.1,36.4 C356.3,36.1 371,28.4 378.6,31.1 C386.3,33.9 387.3,43.8 390.8,52.9 C394.4,62 396.4,76 400,85.9 C403.5,95.8 408.8,104.1 412.2,112.3 C415.5,120.6 419.4,127.2 420.1,135.4 C420.8,143.7 414.7,153 416.4,161.8 C418.1,170.6 427.1,178.8 430.4,188.2 C433.8,197.5 431.4,213.5 436.5,217.9 C441.6,222.3 452.8,216.8 460.9,214.6 C469,212.4 476.6,208.2 485.3,204.7 C493.9,201.2 504.1,195.7 512.7,193.5 C521.3,191.3 528.9,190.7 537.1,191.5 C545.2,192.3 556.1,195.6 561.4,198.1 C566.8,200.6 570.9,201.2 569.4,206.7 C567.8,212.2 557.9,223.7 552.3,231.1 C546.7,238.5 541.9,245.4 535.8,250.9 C529.7,256.4 522.6,259.4 515.7,264.1 C508.8,268.8 501.5,276.5 494.4,279.3 C487.3,282 480.2,279.1 473.1,280.6 C466,282.1 457.8,286.1 451.8,288.5 C445.7,290.9 442.6,292.3 436.5,295.1 C430.4,298 422.3,301.5 415.2,305.7 C408.1,309.9 401.5,315 393.9,320.2 C386.3,325.4 377.6,330.6 369.5,336.7 C361.4,342.7 350.9,349.9 345.1,356.5 C339.3,363.1 339.3,375.2 334.8,376.3 C330.2,377.4 323.1,368.6 317.7,363.1 C312.3,357.6 309.6,347.7 302.5,343.3 C295.4,338.9 282.7,341.1 275.1,336.7 C267.4,332.3 261.3,324.6 256.8,316.9 C252.2,309.2 251.7,304.8 247.6,290.5 C243.6,276.2 239,242.4 232.4,231.1 C225.8,219.8 216.7,224 208,222.5 C199.4,221.1 189.7,224.9 180.6,222.5 C171.5,220.1 162.8,211.3 153.2,208 C143.5,204.7 132.9,204.4 122.7,202.7 C112.6,201.1 102.4,198.1 92.3,198.1 C82.1,198.1 70.9,201.5 61.8,202.7 C52.7,203.9 43.6,205.4 37.4,205.4 C31.2,205.4 24.1,206.1 24.6,202.7 Z"/>
                        <text class="cadeado" x="215" y="118">🔒</text>
                        <text class="em-breve" x="215" y="146">Em breve</text>
                        <text class="em-breve-sub" x="215" y="166">Interior de São Paulo</text>
                    </g>

                    <!-- Capital no lugar real do estado, com um "zoom" até o cartão das zonas -->
                    <g class="capital" aria-hidden="true">
                        <polygon class="zoom" points="401,282 438,282 584,382 352,382"/>
                        <circle class="pulso" cx="419.5" cy="264.1" r="24"/>
                        <path class="mini" d="M400.9,253.9 C401.7,251.9 402.6,249.4 404,247.8 C405.4,246.1 407.4,245 409.4,244 C411.4,243.1 413.6,242.3 415.9,242 C418.2,241.7 420.7,241.9 423,242.3 C425.4,242.8 427.8,243.5 429.8,244.7 C431.9,245.9 433.7,247.8 435.3,249.5 C436.8,251.2 438.3,253.1 439,254.9 C439.7,256.7 440,258.6 439.7,260.4 C439.4,262.1 438.6,264 437.3,265.5 C436.1,266.9 433.6,267.6 432.2,268.9 C430.8,270.2 429.6,271.6 428.8,273.3 C428,274.9 428,277 427.5,278.7 C426.9,280.5 426.4,282.6 425.4,283.8 C424.4,285.1 422.7,286.1 421.3,286.2 C420,286.3 418.3,285.6 417.3,284.5 C416.2,283.4 415.8,281.1 415.2,279.4 C414.6,277.7 414.4,275.8 413.5,274.3 C412.7,272.8 411.5,271.2 410.1,270.2 C408.7,269.2 406.5,269 405,268.2 C403.5,267.3 401.9,266.5 400.9,265.1 C400,263.7 399.2,261.6 399.2,259.7 C399.2,257.8 400.1,255.9 400.9,253.9 Z"/>
                        <rect class="cartao" x="340" y="382" width="256" height="310" rx="18"/>
                        <text class="titulo-capital" x="468" y="404">Capital · São Paulo</text>
                    </g>

                    <!-- As 4 zonas da capital: as únicas partes clicáveis. Um mapa redondo, como uma bússola:
                         cada zona é um quarto do anel, na direção dela (Norte em cima, Leste à direita...).
                         Centro do anel em (468,550), raio externo 112 e interno 40. -->
                    <circle class="trilho" cx="468" cy="550" r="118" aria-hidden="true"/>
                    <g class="zona" data-zona="NORTE" tabindex="0" role="button" aria-label="Filtrar Zona Norte">
                        <path d="M388.8,470.8 A112,112 0 0 1 547.2,470.8 L496.28,521.72 A40,40 0 0 0 439.72,521.72 Z"/>
                        <text x="468" y="473">Norte</text>
                        <text class="qtd" x="468" y="490"></text>
                    </g>
                    <g class="zona" data-zona="LESTE" tabindex="0" role="button" aria-label="Filtrar Zona Leste">
                        <path d="M547.2,470.8 A112,112 0 0 1 547.2,629.2 L496.28,578.28 A40,40 0 0 0 496.28,521.72 Z"/>
                        <text x="542" y="547">Leste</text>
                        <text class="qtd" x="542" y="564"></text>
                    </g>
                    <g class="zona" data-zona="SUL" tabindex="0" role="button" aria-label="Filtrar Zona Sul">
                        <path d="M547.2,629.2 A112,112 0 0 1 388.8,629.2 L439.72,578.28 A40,40 0 0 0 496.28,578.28 Z"/>
                        <text x="468" y="622">Sul</text>
                        <text class="qtd" x="468" y="639"></text>
                    </g>
                    <g class="zona" data-zona="OESTE" tabindex="0" role="button" aria-label="Filtrar Zona Oeste">
                        <path d="M388.8,629.2 A112,112 0 0 1 388.8,470.8 L439.72,521.72 A40,40 0 0 0 439.72,578.28 Z"/>
                        <text x="394" y="547">Oeste</text>
                        <text class="qtd" x="394" y="564"></text>
                    </g>
                    <!-- Miolo do anel: só marca a capital, não é clicável -->
                    <g class="miolo" aria-hidden="true">
                        <circle cx="468" cy="550" r="33"/>
                        <text x="468" y="555">SP</text>
                    </g>

                    <!-- "Todas as zonas": tira o filtro sem sair do mapa -->
                    <g class="zona-todas" tabindex="0" role="button" aria-label="Mostrar todas as zonas">
                        <rect x="30" y="556" width="168" height="36" rx="18"/>
                        <text x="114" y="579">Todas as zonas</text>
                    </g>

                    <!-- Legenda -->
                    <g class="legenda" aria-hidden="true">
                        <rect x="30" y="610" width="16" height="16" rx="4" fill="url(#bloqueado)" stroke="#c7d3d9"/>
                        <text x="56" y="623">Interior do estado · em breve</text>
                        <rect x="30" y="640" width="16" height="16" rx="4" class="legenda-ativa"/>
                        <text x="56" y="653">Capital · clique numa zona para filtrar</text>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
