<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda da prestadora - conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="agenda">
    <main class="wrap">
        <span class="tag">ÁREA DO PRESTADOR</span>
        <h1 style="font-size:24px;color:var(--p);margin:10px 0 20px">
            Olá, <span id="nomeDiarista">Prestadora</span>! Você tem <span id="novos">nenhum pedido novo</span>
        </h1>

        <div class="grid2 grid-agenda">
            <div>
                <h3>Meus pedidos</h3>
                <div class="chips" id="filtroPedidos" style="margin:10px 0 16px">
                    <span class="chip on" data-status="">Todos</span>
                    <span class="chip" data-status="PENDENTE">Pendentes</span>
                    <span class="chip" data-status="ACEITA">Aceitos</span>
                    <span class="chip" data-status="CONCLUIDA">Concluídos</span>
                    <span class="chip" data-status="RECUSADA">Recusados</span>
                </div>
                <div id="pedidos"></div>
            </div>

            <div class="card" style="align-self:start">
                <h3>Minha agenda</h3>
                <small>Serviços confirmados nos próximos 7 dias</small>
                <div class="days" id="dias" style="margin-top:12px"></div>
                <div id="compromissos" style="margin-top:14px"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
