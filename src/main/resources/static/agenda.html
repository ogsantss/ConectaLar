<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>conectaLar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="agenda">

        <h1 style="font-size:24px;color:var(--p);margin:10px 0 20px">Olá, Prestadora! Você tem <span id="novos">0</span>

            <div class="card">

                    <div class="day on">02</div>
                    <div class="day">03</div>

                <p style="margin-top:14px"><b>08:00</b> <span class="tag">Limpeza residencial completo</span></p>
                <p><b>14:00</b> <span class="tag">Passar roupa</span></p>

        </div>
