# Banco salvo em arquivo (pasta data/ na raiz do projeto): os cadastros não somem
# quando o app reinicia. Para começar do zero, pare o app e apague a pasta data/.
# AUTO_SERVER=TRUE deixa abrir o banco em mais de um processo ao mesmo tempo (ex: app + testes).
# WRITE_DELAY=0 grava cada alteração na hora, então nada se perde se o app for parado à força.
spring.datasource.url=jdbc:h2:file:./data/conectalar;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria ou ajusta as tabelas sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL gerado pelo Hibernate (util para estudar e depurar).
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console